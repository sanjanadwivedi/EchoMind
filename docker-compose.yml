version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: echomind-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: echomind
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres1234
    ports:
      - "5432:5432"
    volumes:
      - echomind_pgdata:/var/lib/postgresql/data

volumes:
  echomind_pgdata:
